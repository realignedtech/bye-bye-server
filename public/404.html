<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Bye Bye Server</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#013373" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(circle at top, #3b8fce, #013373 60%, #012255);
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      main { max-width: 36rem; text-align: center; }
      .code {
        margin: 0 0 0.75rem;
        color: #bfdbfe;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 1rem; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.1; }
      .body { margin: 0 auto 2rem; color: #dbeafe; font-size: 1.05rem; line-height: 1.65; }
      a {
        display: inline-block;
        border-radius: 0.6rem;
        background: #fff;
        color: #013373;
        font-weight: 700;
        padding: 0.8rem 1.4rem;
        text-decoration: none;
      }
      a:hover { background: #eff6ff; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page said goodbye.</h1>
      <p class="body">The link may be out of date, or the address may have been mistyped. All published alternatives are available from the homepage.</p>
